
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Brain Byte</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="site-nav" id="site-nav"></nav>

<div class="container">
  <div class="card form-card">
    <p class="eyebrow">Account recovery</p>
    <h2 id="page-title">Forgot your password?</h2>
    <p id="page-desc">Enter your email and we'll send you a reset code.</p>

    <div class="form-error" id="error-box"></div>
    <div class="form-success" id="success-box" style="display:none;"></div>

    <form id="request-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="request-btn">
        Send Reset Code
      </button>
    </form>

    <form id="confirm-form" style="display:none;">
      <div class="form-group">
        <label for="code">Reset code</label>
        <input type="text" id="code" required maxlength="6"
          placeholder="123456"
          style="font-size:22px; letter-spacing:5px; text-align:center;">
      </div>

      <div class="form-group">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" required
          minlength="8" maxlength="13"
          placeholder="8–13 characters, including a number or symbol">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="confirm-btn">
        Reset Password
      </button>
    </form>

    <p style="margin-top:18px; font-size:14px; text-align:center;">
      <a href="login.html">Back to log in</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
renderNav();

let submittedEmail = '';

document.getElementById('request-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const errorBox = document.getElementById('error-box');
  const btn = document.getElementById('request-btn');

  errorBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Sending...';

  submittedEmail = document.getElementById('email').value;

  try {
    const result = await apiRequest('/password-reset/request', {
      method: 'POST',
      body: { email: submittedEmail },
    });

    document.getElementById('page-title').textContent = 'Check your email';
    document.getElementById('page-desc').textContent = result.message;
    document.getElementById('request-form').style.display = 'none';
    document.getElementById('confirm-form').style.display = 'block';

  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';

  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Reset Code';
  }
});

document.getElementById('confirm-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const errorBox = document.getElementById('error-box');
  const successBox = document.getElementById('success-box');
  const btn = document.getElementById('confirm-btn');

  errorBox.style.display = 'none';

  const password = document.getElementById('new-password').value;

  // Check password length
  if (password.length < 8 || password.length > 13) {
    errorBox.textContent = 'Password must be between 8 and 13 characters.';
    errorBox.style.display = 'block';
    return;
  }

  // Check for a number or special character
  const hasNumber = /[0-9]/.test(password);
  const hasSpecialCharacter = /[^A-Za-z0-9\s]/.test(password);

  if (!hasNumber && !hasSpecialCharacter) {
    errorBox.textContent = 'Password must contain at least one number or special character.';
    errorBox.style.display = 'block';
    return;
  }

  // Check for at least one letter
  const hasLetter = /[A-Za-z]/.test(password);

  if (!hasLetter) {
    errorBox.textContent = 'Password must contain at least one letter.';
    errorBox.style.display = 'block';
    return;
  }

  // Reject passwords made up of repeated characters
  if (/^(.)\1+$/.test(password)) {
    errorBox.textContent = 'Password cannot consist of the same repeated character.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    const result = await apiRequest('/password-reset/confirm', {
      method: 'POST',
      body: {
        email: submittedEmail,
        code: document.getElementById('code').value,
        newPassword: password,
      },
    });

    successBox.textContent = result.message;
    successBox.style.display = 'block';
    document.getElementById('confirm-form').style.display = 'none';

    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1500);

  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';

    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
